name: portfolio
description: Personal portfolio website — Flutter web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.1.0
  easy_localization: ^3.0.8
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.2
  animate_do: ^4.2.0
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2
  lottie: ^3.3.1
  animated_text_kit: ^4.2.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  photo_view: ^0.15.0
  pdfx: 2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
  - assets/translations/
  - assets/images/
  - assets/images/projects/
  - assets/images/projects/logo_maker/
  - assets/icons/tech/
  - assets/pdf/
  - assets/videos/projects/
#  assets:
#    - assets/translations/
#    - assets/images/
#    - assets/images/projects/
#    - assets/icons/tech/
#    - assets/pdf/
#    - assets/videos/projects/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
